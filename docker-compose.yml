# pycromap with docker compose: the web server, renderers, and pycromap's own
# database and tile cache in a data/ directory on the host they share. Fetch
# the submodules first (git submodule update --init --recursive).
#
#   docker compose up --build
#
# The renderer runs RENDER_WORKERS (8) render_tiles processes, restarting
# any that die (manage.py render_fleet):
#
# The map is then at http://localhost:8082/ (PYCROMAP_PORT to change it).
#
# The pycrocosm map database is reached at host.docker.internal, the machine
# running Docker, unless PYCROMAP_DB_HOST says otherwise; PostgreSQL there must
# accept connections from the Docker network. Its name, user, password and
# table prefixes come from .env, as for running pycromap without Docker (see
# .env.example).
#
# pyo5m is built from pycrocosm's extractupdate/pyo5m, beside this project,
# unless PYO5M_SOURCE says where it is.
#
# The web server is gunicorn, with WEB_WORKERS processes (16). Each handles one
# request at a time, and a tile request waits up to TILE_REQUEST_WAIT seconds
# (600) for the renderer, so WEB_TIMEOUT (660) must be longer. Static files
# and cached tiles are served by Django while DJANGO_DEBUG is on (the default).

x-pycromap: &pycromap
  image: pycromap
  build:
    context: .
    additional_contexts:
      pyo5m: ${PYO5M_SOURCE:-../extractupdate/pyo5m}
    args:
      # Files compiled at once
      BUILD_JOBS: ${BUILD_JOBS:-4}
  environment:
    PYCROCOSM_DB_HOST: ${PYCROMAP_DB_HOST:-host.docker.internal}
    PYCROCOSM_DB_PORT: ${PYCROCOSM_DB_PORT:-5432}
    PYCROCOSM_DB_NAME: ${PYCROCOSM_DB_NAME:-db_map}
    PYCROCOSM_DB_USER: ${PYCROCOSM_DB_USER:-pycrocosm}
    PYCROCOSM_DB_PASSWORD: ${PYCROCOSM_DB_PASSWORD:-}
    PYCROCOSM_STATIC_PREFIX: ${PYCROCOSM_STATIC_PREFIX:-planet_static_}
    PYCROCOSM_MODIFY_PREFIX: ${PYCROCOSM_MODIFY_PREFIX:-pycrocosm_mod_}
    MAP_INITIAL_BBOX: ${MAP_INITIAL_BBOX:--1.095,50.795,-1.085,50.8}
    VIEWER_MAX_ZOOM: ${VIEWER_MAX_ZOOM:-16}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    TILE_REQUEST_WAIT: ${TILE_REQUEST_WAIT:-600}
    RENDER_TIMEOUT: ${RENDER_TIMEOUT:-600}
    SUMMARY_MAX_DEPTH: ${SUMMARY_MAX_DEPTH:-1}
    # Whether idle renderers work ahead (see README.md)
    RENDER_IDLE_WORK: ${RENDER_IDLE_WORK:-false}
    IDLE_RADIUS: ${IDLE_RADIUS:-4}
    IDLE_SEEDS: ${IDLE_SEEDS:-200}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # The database (PYCROMAP_DB) and tile cache (TILE_CACHE_DIR), on the host
    - ./data:/data
    # The coastline and landcover shapefiles the tilemaker config reads, if
    # downloaded (tilemaker's get-coastline.sh and get-landcover.sh)
    - ${COASTLINE_DIR:-./tilemaker/coastline}:/app/tilemaker/coastline:ro
    - ${LANDCOVER_DIR:-./tilemaker/landcover}:/app/tilemaker/landcover:ro

services:
  migrate:
    <<: *pycromap
    command: ["python", "manage.py", "migrate", "--noinput"]

  web:
    <<: *pycromap
    command: ["gunicorn", "pycromap.wsgi", "--bind", "0.0.0.0:8000",
              "--workers", "${WEB_WORKERS:-16}", "--timeout", "${WEB_TIMEOUT:-660}",
              "--access-logfile", "-"]
    ports:
      - "${PYCROMAP_PORT:-8082}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  renderer:
    <<: *pycromap
    command: ["python", "manage.py", "render_fleet"]
    depends_on:
      migrate:
        condition: service_completed_successfully
